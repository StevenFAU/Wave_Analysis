# Shore-camera video vs single image on identical clips (WebCOOS, CDIP labels).
# Fixed 2026-11-18 before any clip was scored: docs/experiments/webcoos_video.md.
# Run by scripts/train_video_probe.py (deploy/dgx/run.sh with
# TRAIN_SCRIPT=scripts/train_video_probe.py PKG=webcoos_video_v1).
name: webcoos_video_v1
package:
  out: data/processed/packages/webcoos_video_v1   # scripts/webcoos_video_clips.py pack
data:
  min_sun_elevation_deg: 0.0      # clips with the sun above the horizon at their midpoint
  frames: 64                      # 16 s at 4 fps, around the clip's midpoint
  tile_px: 256                    # two squares (left and right) of the 256-px-high frame
encoders:
  vjepa2:                         # video encoder, frozen (Apache-2.0 / MIT)
    hf_id: facebook/vjepa2-vitl-fpc64-256
    layers: [11, 15, 19, 23]      # 50, 67, 83, 100 % of 24 blocks (0-based)
    pool: [8, 4, 4]               # time x height x width tokens per tile after pooling
    arms: [video, still, shuffled]
  dinov3:                         # image encoder, frozen (DINOv3 licence: research use)
    timm: vit_large_patch16_dinov3.lvd1689m
    layers: [11, 15, 19, 23]
    pool: [1, 4, 4]
    arms: [image]                 # the middle frame (the same pixels as "still")
targets: [Hs_label_m, Tp_label_s] # logs, standardised on each training fold
heads:
  primary: attentive              # AttentiveProbe; "mean" (MeanProbe) reported beside it
  d: 256
  heads: 4
  dropout: 0.2
  epochs: 60
  batch_size: 32
  lr: 3.0e-4
  weight_decay: 0.05
  seeds: [0, 1, 2, 3, 4]          # predictions averaged in log space
evaluation:
  folds: 5                        # GroupKFold over local dates (all cameras of a date together)
  inner_val: one training date per fold picks the epoch (early stopping)
  bootstrap: {n_boot: 2000, alpha: 0.05, seed: 0, groups: local_day}
  bars:
    M1: video minus still, RMSE of H_s, 95 % interval below zero
    M2: video minus still, RMSE of T_p, 95 % interval below zero
    # Whole-clip bars, fixed 2026-11-18 before any clip was scored (docs/experiments/webcoos_video.md,
    # "Whole-clip bars"). One probe trained on every 16-s window of the training clips; the
    # clip estimate averages all K = floor(duration / 16 s) non-overlapping windows
    # (H_s: energy mean; T_p: geometric mean); "window" reads only the window holding the midpoint.
    M3: clip minus window, RMSE of H_s, 95 % interval below zero
    M4: clip minus window, RMSE of T_p, 95 % interval below zero
    M5: clip + pixel spectrum minus clip, RMSE of T_p, 95 % interval below zero
  whole_clip:
    window_s: 16
    frames_per_window: 64        # 4 fps
    windows: all_non_overlapping # K = floor(duration_s / 16), counted from the clip start
    single: midpoint_window
    hs_average: energy           # sqrt(mean(H_s^2)); mean of log H_s reported beside it
    tp_average: geometric
    reported: [clip mean-log H_s, pooled (learned record pooler), clip-image (DINOv3 per window), pixel spectrum alone, Kim 5-class at 1 / 11 / K windows]
    # Implementation and pixel-spectrum recipe v1, fixed 2026-11-18 before scoring
    # (docs/experiments/webcoos_video.md, "Whole-clip implementation"): windows cut by
    # scripts/webcoos_video_clips.py windows; spectrum wave_analysis.processing.pixel_spectrum
    # (RECIPE = 1); ridge heads alpha 1 on standardised inputs (train_video_probe.RIDGE_ALPHA).
  # Physics features v2, bars M6-M7: fixed 2026-11-19 on the development dates, before any
  # confirmation date was opened (docs/experiments/webcoos_video.md, "Physics features v2").
  # Features: scripts/webcoos_video_clips.py physics (wave_analysis.processing.pixel_spectrum.physics_v2,
  # RECIPE_V2 = 2), the package's physics_v2.csv; heads: train_video_probe.physics_v2_arms.
  physics_v2:
    dev_dates: configs/experiments/webcoos_video_dev_dates.txt
    dev_dates_sha256: 64685e3602fac031391295d35eba7b07581dac28852f6c89e8df154433fcc289
    min_confirmation_dates: 15   # bars scored on the confirmation dates only (all others)
    M6: ridge on v1's ten spectrum features + v2's four minus ridge on v1's ten, RMSE of T_p, 95 % interval below zero
    M7: ridge on log clip H_s + five breaking features minus ridge on log clip H_s alone, RMSE of H_s, 95 % interval below zero
    reported: [untrained T_pix v2 minus v1, clip + v2 spectrum minus clip_ridge (T_p), per camera, M6-M7 with a camera intercept, Oak Island T_p beside Kamagata 1.42 s, the T_p comparisons against T_e = Tm-1,0]
  reported: [video minus shuffled, video minus image (DINOv3), per camera, Kamagata metrics at Oak Island, Kim 5-class accuracy]
  first_scored_run: at least 15 local dates framed; interim until the sample download finishes
