# Protocol check R (fixed 2026-11-18, before any run on it; not a bar): v2 with a
# RANDOM split of strips, the protocol of Choi et al. 2020 and Kim et al. 2023
# (neighbouring hours of one buoy and day on both sides). It shows what that protocol
# adds; our results stay those at unseen buoys. Package derived from v2 by
# scripts/buoycam_random_split.py (labels.csv gains split_random; images identical).
# Everything else as v2.
#
# Wave heights in metres from NDBC buoy cameras (v2, fixed 2026-11-18 before any
# v2 training). One model gives the total, wind-wave and swell height of each
# strip, so every published measure can be computed from it: an RMSE in metres
# (Kamagata et al. 2026), calm/rough thresholds (Choi et al. 2020), any classes
# (Kim et al. 2023; the WMO classes of v0). The second arm adds each view's
# horizon roll and pitch (the buoy's motion, measured in the image), the
# real-data test of image + attitude (Yang et al. 2026, in simulation).
# Same strips, light rules, partitions and period as v0. Bars: the experiment doc.
#
#   scripts/buoycam_horizon.py                                                     # horizons of every view
#   scripts/buoycam_package.py configs/experiments/ndbc_buoycam_heights_v2.yaml    # package + views.csv
#   scripts/train_wave_heights.py --config ... [--aux horizon]                     # deploy/dgx/run.sh
#   scripts/compare_papers.py runs/<seed 0> runs/<seed 1> runs/<seed 2>            # every paper's measure
#
name: ndbc_buoycam_heights_v2r
description: >
  Hourly six-view strips of the NDBC buoy cameras (archived from 2026-09-23),
  twilight and daylight, labelled by the same buoy's significant wave height
  (realtime .spec WVHT, computed on board from the hull-motion record): mean
  of the records centred within 30 min (ADR 0010); also its wind-wave and swell
  heights by the same rule, its wind, and each view's horizon motion
  (views.csv). The burned-in caption (station ID, time) is cut from every image.
input:
  samples: data/processed/pairs/ndbc_buoycam/samples.parquet
  # The archive grows every hour; v0 ends with the wave records of the
  # realtime snapshot of 2026-11-14 15:33 UTC.
  start_utc: "2026-09-23T00:00:00Z"
  end_utc: "2026-11-14T15:00:00Z"
task:
  id_col: sample_id
  label: Hs_label_m
  filters:
    # Paired, readable and labelled (the pairing's own exclusions); six views
    # of a known format; light enough to see the sea (below).
    - {column: exclusion, op: isna}
    - {column: width, op: in, value: [2880, 2304]}   # 3360 and 3840 px strips hold 7 or 8 views (11 strips)
    - {column: sun_elevation_deg, op: ge, value: -6.0}
    - {column: usable_views, op: ge, value: 3}
  classes:
    # WMO-No. 306, code table 3700, bands closed on the right (as Currituck).
    names: [smooth, slight, moderate, rough_or_more]
    bounds_m: [0.5, 1.25, 2.5]
  near_boundary_rel_tol: 0.04
images:
  # Twilight strips are in colour and show the sea (the cameras raise their
  # exposure); at night the views are black (median grey 2). Low sun leaves
  # some views dark or glared, so the rule is per view: a view is usable when
  # its mean grey is at least 20 and its standard deviation at least 4 (on
  # 0-255; night views: mean 2, sd 0.1). A strip is kept with 3 usable views.
  min_sun_elevation_deg: -6.0
  min_view_mean: 20.0
  min_view_std: 4.0
  min_usable_views: 3
split:
  station:
    # Unseen buoys. Buoys within 300 km of each other (chained) form one group
    # and go to the same partition, so every test buoy is at least 300 km from
    # every training buoy (44 groups; the largest: US West Coast 21 buoys,
    # US East Coast 13, Gulf of Alaska 9).
    protocol: cross_station
    group_km: 300
    fractions: [0.7, 0.15, 0.15]
    seed: 0
    partitions_from: data/processed/packages/ndbc_buoycam_sea_state_v0/stations.csv
  time:
    # The same buoys, later weeks: train before val_start, val, then test,
    # with 72 h left out after each boundary so that one swell cannot link them.
    protocol: cross_time
    val_start: "2026-10-24"
    test_start: "2026-11-03"
    embargo: 72h
  audit:
    min_gap: 72h
baselines:
  # No image: the training strips' majority class, and for the time split
  # each buoy's own majority class in its training weeks.
  station_majority: [time]
  # The physics baseline (added 2026-11-14): ERA5 significant wave height at
  # the grid point with sea data nearest each buoy (scripts/buoycam_era5.py),
  # interpolated to the strip's time (no value across a gap over 3 h) and
  # corrected with a line fitted on each split's training strips.
  era5:
    path: era5/buoycam/era5_at_buoys.parquet
    max_gap: 3h
    optional: true                  # absent until downloaded and extracted
package:
  out: data/processed/packages/ndbc_buoycam_heights_v2r
  views_from: data/processed/horizon/ndbc_buoycam_sea_state_v0/horizons.parquet
  jpeg_quality: 95                  # strips keep their size; only the caption is cut
model:
  # wave_analysis.models.wave_heights.MultiViewRegressor: one backbone per view;
  # (arm 2) the view's de-mounted horizon roll and pitch join its feature; a
  # one-layer transformer over the usable views; the masked mean gives the log
  # of each height (Huber loss on standardised logs; missing heights skipped).
  backbone: convnext_tiny
  pretrained: true
  input: views
  view_size: [270, 480]
  targets: [Hs_label_m, wind_wave_label_m, swell_label_m]   # the first chooses the epoch (val RMSE)
  target_names: [hs, wind_wave, swell]
  mixer: {d_model: 256, heads: 4, layers: 1, dropout: 0.1}
  augment:
    horizontal_flip: false
    scale: [1.0, 1.0]               # no random crop: the horizon's height in a view is the buoy's pitch
    rotate_deg: 0.0                 # no rotation: the horizon's tilt is the buoy's roll
    brightness: 0.2
    contrast: 0.2
    saturation: 0.1
  epochs: 10
  batch_size: 32
  lr: 3.0e-4
  weight_decay: 0.05
  warmup_epochs: 1
  num_workers: 8
  amp: none
evaluation:
  # Intervals from a bootstrap over whole buoys (station split: the unit that
  # generalizes) or whole buoy-days (time split).
  bootstrap:
    group_col: {station: station_id, time: station_day, random: station_id}
    n_boot: 1000
    alpha: 0.05
    seed: 0
seed: 0
ensemble:
  seeds: [0, 1, 2]
  combine: mean_log_height
