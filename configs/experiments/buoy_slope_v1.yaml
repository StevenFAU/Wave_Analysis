name: buoy_slope_v1
seed: 0
images: {min_view_mean: 20, min_view_std: 4}
model:
  input: views
  backbone: convnext_tiny
  n_views: 6
  view_size: [270, 480]
  targets: [slope_percent, wind_wave_label_m]
  target_names: [slope, wind_wave]
  target_units: [pct, m]
  mixer: {d_model: 256, heads: 4, layers: 1, dropout: 0.1}
  augment: {scale: [1.0, 1.0], rotate_deg: 0.0, brightness: 0.2, contrast: 0.2, saturation: 0.1}
  lp_epochs: 2
  backbone_lr_scale: 0.1
  epochs: 10
  batch_size: 32
  num_workers: 8
  lr: 0.0003
  weight_decay: 0.05
  warmup_epochs: 1
  amp: bf16
evaluation:
  bootstrap: {group_col: station_group, n_boot: 2000, alpha: 0.05, seed: 0}
