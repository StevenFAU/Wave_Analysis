# Published research datasets held in permanent repositories (found by the
# data source scan of 2026-10-08, docs/literature/data_source_scan_2026-10.md).
# scripts/download_external.py fetches every file with a URL into
# data/external/<id>/, checks its size and the repository's MD5, and records
# each request in data/manifests/raw/external.csv. data/external/ is not in the
# offsite sync: the repository is the backup, and the files are re-downloadable.
# File lists, sizes and MD5s were taken from the repositories' own APIs on
# 2026-10-08 (DSpace REST for UW ResearchWorks, the EDS object list for AADC).
datasets:

  - id: schwendeman_thomson_2017_ship_stereo
    title: >-
      Data to accompany the article "Sharp-crested Breaking Surface Waves Observed
      from a Ship-Based Stereo Video System"
    creators: [Schwendeman, Michael, Thomson, Jim]
    year: 2017
    repository: UW ResearchWorks (University of Washington)
    landing: http://hdl.handle.net/1773/38314
    article: https://doi.org/10.1175/JPO-D-16-0187.1
    license: CC BY 3.0 US
    gaps: [G-6, G-9]
    content: >-
      R/V Thomas G. Thompson, North Pacific, Dec 2014 - Jan 2015. Gridded stereo
      surface elevation and radiance (one-minute bursts, 40 m x 40 m at 0.25 m,
      5 or 7.5 Hz) from 55 five-minute (the readme says 52) and 10 full captures, with camera motion
      from a Novatel SPAN-IGM IMU; SWIFT drifter and Datawell Waverider spectra;
      ship data; MATLAB analysis code; results and plots. Raw frames on request.
