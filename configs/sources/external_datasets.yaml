  - id: alberello_2017_agulhas_wass
    title: >-
      Wave acquisition stereo-camera system measurements (WASS) from a voyage of the
      S.A. Agulhas II, July 2017
    creators: [Alberello, A., Bennetts, L., Onorato, M., Vichi, M., Machutchon, K., Eayrs, C.,
               Ntamba Ntamba, B., Benetazzo, A., Bergamasco, F., Nelli, F., Pattani, R.,
               Clarke, H., Toffoli, A.]
    year: 2021
    repository: Australian Antarctic Data Centre
    landing: https://doi.org/10.26179/Q9BD-5F74
    license: CC BY 4.0
    gaps: [G-6]
    content: >-
      Antarctic marginal ice zone (62 S, 30 E), 4 July 2017, during an explosive
      polar cyclone. Two 2448 x 2048 monochrome cameras at 2 Hz on the port side;
      reconstructed surface elevation (mm) on a 1 m grid, one NetCDF file per
      acquisition.
    access_note: >-
      AADC releases files only after an email address is submitted on
      https://data.aad.gov.au/dataset/571cdc2c-c810-4996-ae82-b79dc25a894e/download
      (under 2 GB: the zip download starts and a one-time link is emailed). No
      direct URLs or checksums are published; the object list gives the sizes.
    files:
