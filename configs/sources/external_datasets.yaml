  - id: carini_duck2016_ir_lidar
    title: >-
      Dataset to support "Surf Zone Waves at the Onset of Breaking 1. LIDAR and IR
      Data Fusion Method"
    creators: [Carini, Roxanne J.]
    year: 2020
    repository: UW ResearchWorks (University of Washington)
    landing: http://hdl.handle.net/1773/46586
    license: CC BY
    gaps: [G-5]
    content: >-
      USACE FRF, Duck NC, 7-8 Nov 2016. Line-scanning lidar wave profiles fused with
      tower- and pier-mounted thermal IR imagery of surf-zone waves; wave conditions
      from the FRF ADOP in 3.5 m depth and the end-of-pier tide gauge; bathymetry
      surveys of 5 and 18 Nov 2016. SurfZoneWavesAtOnsetBreaking.mat (readme of
      2020-03-17) supports Carini et al. (2021a, b) in JGR Oceans;
      lidarIR_sharedData.mat (readme of 2018-08-03) supports the breaker-type
      manuscript 2018JC014441 (tracked waves with height, period, manual breaker
      type).
    files:
      - {name: ReadMe_SurfZoneWavesAtOnsetBreaking.rtf, size_bytes: 29037, md5: df53551b8f6738b4ed964d5ed7f51869,
         url: "https://digital.lib.washington.edu/server/api/core/bitstreams/2289845e-de46-487b-84e6-04f77d51522a/content"}
      - {name: ReadMe_lidarIR_sharedData.txt, size_bytes: 2111, md5: b13127c530158130b8524fcfa1145134,
