# DINOv3 ViT-B/16 continued on unlabelled NDBC buoy-camera views with the FINO recipe:
# rank 6 of reports/Wave camera architectures beyond backbones.md. Fixed 2026-11-18,
# before any pretraining; data, reasons and bar P1 in docs/experiments/domain_pretraining.md.
#
# Derived from FINO's reference recipe dinov3/configs/train/vitl16_fmow_guided.yaml
# (facebookresearch/dinov3, branch FINO, commit 81aae9a). Every change from it is
# marked "# ours:". Run by deploy/dgx/pretrain.sh (torchrun, one GPU, Docker), which
# sets train.dataset_path, train.output_dir and student.resume_from_teacher_chkpt.
#
# Two stages as FINO: steps 0-4,999 the backbone is frozen (except the patch
# embedding) and the new DINO/iBOT/guide heads learn; then it unfreezes with a
# 1,000-step linear LR ramp. Teacher checkpoints (eval/<step>/teacher_checkpoint.pth)
# every 2,500 steps; scripts/dinov3_probe.py picks one on the validation buoys.
# Batch 256 views per step x 30,000 steps = 7.68 M view-crops, about 47 passes over
# the 165,021 views of the 55 training buoys. Smoke runs (2026-11-18): with activation
# checkpointing (FINO's setting) batch 256 peaks at 25 GB, 1.44 s per step on the shared
# GPU, so 30,000 steps take about 12 h; without it 84 GB, above the 70 GB limit.

MODEL:
  META_ARCHITECTURE: GuidedSSLMetaArch
  DEVICE: cuda
  WEIGHTS: ''
  DTYPE: float32

compute_precision:
  param_dtype: bf16
  reduce_dtype: fp32
  sharding_strategy: SHARD_GRAD_OP

dino:
  loss_weight: 1.0
  global_ignore_diagonal: true
  head_n_prototypes: 65536
  head_bottleneck_dim: 256
  head_norm_last_layer: false
  head_nlayers: 3
  head_hidden_dim: 2048
  koleo_loss_weight: 0.1     # Disabled at run time because sigreg.koleo_too=false.
  koleo_loss_distributed: false
  koleo_topk: 1
  koleo_distributed_replicas: 0
  koleo_distributed_loss_group_size: null
  koleo_distributed_loss_group_data: true
  force_weight_norm: false
  reweight_dino_local_loss: false
  local_loss_weight_schedule:
    start: 0.5
    peak: 0.5
    end: 0.5
    warmup_epochs: 0

ibot:
  loss_weight: 1.0
  mask_sample_probability: 0.5
  mask_ratio_min_max:
  - 0.1
  - 0.5
  mask_random_circular_shift: false
  force_masking_even_with_zero_weight: false
  separate_head: true
  head_n_prototypes: 65536
  head_bottleneck_dim: 256
  head_norm_last_layer: false
  head_nlayers: 3
  head_hidden_dim: 2048

sigreg:
  enabled: true
  mode: bottleneck
  loss_weight: 0.05
  num_slices: 1024
  range_max: 5.0
  n_knots: 17
  koleo_too: false

gram:
  use_loss: false
  compute_stats: false
  loss_weight: 1.0
  ema_teacher: false
  ckpt: null
  it_load_ema_teacher: -1
  rep_update: true
  update_frequency: 50000
  it_first_update: 0
  max_updates: null
  normalized: true
  img_level: false
  remove_neg: false
  remove_only_teacher_neg: false
  tokens_used: all
  global_teacher_resize_method: bicubic
  global_teacher_resize_antialias: false
  loss_weight_schedule: null

guide:
  enabled: true
  lambda_schedule:
    type: sigmoid
    warmup_iterations: 0
  # ours: one guide. The buoy (station) is suppressed with gradient reversal, as FINO
  # suppresses "year" on FMoW (same head and settings); 55 training buoys. FMoW's
  # auxiliary "sub_region" guide has no wave-free counterpart here and is dropped.
  guides:
  - name: station
    enabled: true
    method: prototypical
    hidden_dim: [512, 512, 256]
    dropout: 0.5
    loss_weight: 0.03
    n_outputs: 55
    grl: true
    grl_space: embedding
    use_bce: false
    output_activation: none
    target_normalization:
      output_min: null
      output_max: null
    proto_temperature: 0.02333
    proto_centroid_momentum: 0.999
    proto_phi_min: 0.01

train:
  batch_size_per_gpu: 256          # ours: one GPU (FMoW: 96 per GPU on many GPUs); 128 if 256 does not fit in 70 GB
  dataset_path: BuoyViews:root=<PACKAGE>:split=train   # ours: set by deploy/container/pretrain.sh
  output_dir: <OUTPUT/DIR>
  saveckp_freq: 20
  seed: 0
  num_workers: 20                  # ours: the container has 24 CPUs
  OFFICIAL_EPOCH_LENGTH: 1250
  monitor_gradient_norm: false
  chunk_schedule: []
  cache_dataset: true
  use_teacher_head: true
  learn_from_teacher_tokens: false
  centering: sinkhorn_knopp
  checkpointing: true              # activation checkpointing as FINO (smoke, 2026-11-18: off, batch 256 needed 84 GB)
  checkpointing_full: true
  compile: true
  cudagraphs: false
  sharded_eval_checkpoint: false

student:
  arch: vit_base                   # ours: ViT-B/16 (FINO: ViT-L)
  patch_size: 16
  drop_path_rate: 0.1
  layerscale: 1.0e-05
  pretrained_weights: ''
  ffn_layer: mlp
  ffn_ratio: 4.0
  resume_from_teacher_chkpt: <PATH/TO/PRETRAINED/TEACHER.pth>   # set by the launcher: scripts/dinov3_weights.py to-dinov3
  qkv_bias: false                  # ours: as timm's ViT-B/16 (the B3 model), so the weights load back unchanged
  proj_bias: true
  ffn_bias: true
  norm_layer: layernormbf16        # ours: LayerNorm eps 1e-5, as the released ViT-B/16 (layernorm is eps 1e-6)
  n_storage_tokens: 4
  untie_cls_and_patch_norms: false
  untie_global_and_local_cls_norm: false
  mask_k_bias: false
  in_chans: 3
  pos_embed_type: ropenew
  pos_embed_rope_base: 100.0
  pos_embed_rope_min_period: null
  pos_embed_rope_max_period: null
  pos_embed_rope_normalize_coords: separate
  pos_embed_rope_shift_coords: null
  pos_embed_rope_jitter_coords: null
  pos_embed_rope_rescale_coords: 2.0
  pos_embed_rope_dtype: fp32       # ours, but without effect: DINOv3's trainer does not pass it on (RoPE trains in bf16, as FINO)
  fp8_enabled: false
  fp8_filter: blocks

teacher:
  momentum_teacher: 0.994
  final_momentum_teacher: 1.0
  warmup_teacher_temp: 0.04
  teacher_temp: 0.07
  warmup_teacher_temp_epochs: 0
  in_chans: 3

distillation:
  enabled: false
  full_cfg_path: ''
  checkpoint_path: ''

multidistillation:
  enabled: false

hrft:
  enabled: false
  checkpoint_path: ''

optim:
  epochs: 24                       # ours: 24 x 1,250 = 30,000 steps (48 at batch 128)
  optimizer: adamw
  weight_decay: 0.04
  weight_decay_end: 0.04
  lr: 5.0e-05            # Ignored when schedules.lr is set (v2 takes precedence).
  warmup_epochs: 0
  min_lr: 5.0e-05
  schedule_trunc_extra: 0.0
  clip_grad: 3.0
  freeze_last_layer_epochs: 0
  scaling_rule: sqrt_wrt_1024
  patch_embed_lr_mult: 0.2
  dino_head_wd_multiplier: 1.0
  layerwise_decay: 0.9
  multi_tensor_optim: true
  dump_fsdp_weights_path: ''
  adamw_beta1: 0.9
  adamw_beta2: 0.999
  grad_norm_normalization: true

crops:
  global_crops_scale:
  - 0.4
  - 1.0
  local_crops_number: 8
  local_crops_scale:
  - 0.05
  - 0.4
  global_crops_size: 224
  local_crops_size: 96
  global_local_crop_pairs_ratios: 1.0
  gram_teacher_crops_size: null
  localcrops_subset_of_globalcrops: false
  share_color_jitter: false
  horizontal_flips: true
  gram_teacher_no_distortions: false
  rgb_mean: [0.485, 0.456, 0.406]
  rgb_std: [0.229, 0.224, 0.225]
  teacher_to_student_resolution_scale: 1.0

evaluation:
  eval_period_iterations: 2500     # a teacher checkpoint every 2,500 steps (ours: 5,000 at batch 128)
  low_freq_every: 5
  config_files:
    high_freq: benchmark_high_frequency.yaml
    low_freq: benchmark_low_frequency.yaml

checkpointing:
  period: 2500                     # ours: full state for resuming
  max_to_keep: 2
  keep_every: 99999999999999999

schedules:
  lr:
    start: 0.0
    peak: 5.0e-05
    end: 5.0e-05
    warmup_iterations: 3000
    freeze_last_layer_iterations: 450
    cosine_iterations: 0
    freeze_student_iterations: 5000      # ours: 5,000 (FMoW 10,000; FINO's README: heads converge sooner)
    backbone_warmup_after_freeze: 1000
    freeze_patch_embed: false
    freeze_cls_token: true
    freeze_mask_token: false             # ours: the public weights have no mask token; it learns from zero
    unfreeze_last_n_blocks: 0
  weight_decay:
    start: 0.04
    peak: 0.04
    end: 0.04
    warmup_epochs: 0
  momentum:
    start: 0.994
    peak: 0.994
    end: 1.0
    warmup_epochs: 0
  teacher_temp:
    start: 0.04
    peak: 0.07
    end: 0.07
    warmup_epochs: 0
