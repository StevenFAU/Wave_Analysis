name: docs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --group dev --group docs --python 3.12
      - run: uv run mkdocs build --strict
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/
