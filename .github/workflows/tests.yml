name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"   # weekly: live upstream-format checks (network job)

permissions:
  contents: read

jobs:
  unit:
    name: pytest (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --group dev --extra netcdf --python ${{ matrix.python }}
      - run: uv run pytest --cov --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v7
        if: matrix.python == '3.12'
        with:
          name: coverage
          path: coverage.xml

  ml:
    name: pytest ml (torch CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --group dev --python 3.12
      - run: uv pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: uv run --no-sync pytest -m ml

  network:
    name: live upstream format checks
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --group dev --extra netcdf --python 3.12
      - run: uv run pytest -m network
