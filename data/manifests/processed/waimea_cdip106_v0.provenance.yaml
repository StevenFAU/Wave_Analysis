pipeline:
  command: python scripts/waimea_benchmark.py
  config:
    name: waimea_cdip106_v0
    description: 'PacIOOS beachcam_003 and beachcam_004 (Waimea Bay, 2009-2013) paired
      with CDIP 106 (6.3 km offshore). Splits by HST day across both cameras; non-vision
      baselines (climatology, persistence, ERA5) and ridge regression on image statistics,
      reported under the window-mean and nearest label rules (ADR 0010).

      '
    task:
      id_col: sample_id
      filters:
      - column: paired
        op: eq
        value: true
      - column: features_ok
        op: eq
        value: true
      labels:
        window_mean: Hs_label_m
        nearest: Hs_nearest_m
    split:
      day:
        protocol: iid_grouped
        group_col: hst_day
        fractions:
        - 0.7
        - 0.15
        - 0.15
        seed: 0
      week:
        protocol: iid_grouped
        group_col: hst_week
        fractions:
        - 0.7
        - 0.15
        - 0.15
        seed: 0
      year:
        protocol: cross_time
        val_start: '2012-01-01T10:00:00Z'
        test_start: '2013-01-01T10:00:00Z'
        embargo: 72h
        group_col: hst_day
      audit:
        group_cols:
        - hst_day
        time_col: time_utc
        min_gap: 6h
    baselines:
      persistence_lags_h:
      - 1
      - 3
      - 24
      persistence_max_age: 1h
      ridge_alphas:
        start: -2
        stop: 5
        num: 15
    evaluation:
      bootstrap:
        group_col: hst_day
        n_boot: 1000
        alpha: 0.05
        seed: 0
      sea_state_edges:
      - 0
      - 1
      - 2
      - 3
      - 4
      - .inf
    seed: 0
