# Wave_Analysis camera-site registry
# ------------------------------------------------------------------------------
# Public shore/coastal camera sites and the in-situ wave instruments proposed
# as their references. This is the machine-readable form of the pairing table in
# docs/literature/landscape_review.md (section 5.3). NDBC buoy cameras are not
# listed: they are their own reference (same hull) and come from the live
# camera listing.
#
# Coordinates of NDBC-listed buoys (including CDIP Waveriders, which NDBC
# distributes under WMO ids) are looked up in data/registry/stations.parquet.
# Instruments NDBC does not list carry explicit coordinates. Distances are
# computed at build time (`wave-analysis dashboard catalog`), never stored.
#
# coordinate_source says where a camera position came from. `approximate: true`
# marks positions that were not read from a provider's metadata.
# Schema: src/wave_analysis/dashboard/catalog.py (CameraSite)
# ------------------------------------------------------------------------------
registry_version: "0.1.0"
sites:

  - site_id: pacioos_waimea
    name: PacIOOS beach camera, Waimea Bay (Oahu)
    provider: PacIOOS
    dataset_id: pacioos_beachcam
    latitude: 21.643578
    longitude: -158.06339
    coordinate_source: "PacIOOS ERDDAP beachcam_004 latitude/longitude (queried 2026-09-26)"
    period: "2009-02 to 2013-10 (archive)"
    references:
      - {station_id: "51201", network: CDIP, cdip_id: "106", role: primary}
      - {station_id: "51003", network: NDBC, role: offshore}

