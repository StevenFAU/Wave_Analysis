    adapter: wave_analysis.sources.pacioos
    doc: docs/datasets/pacioos_beachcam.md
    verification:
      status: verified
      date: 2026-09-26
      evidence:
        - "https://pae-paha.pacioos.hawaii.edu/erddap/tabledap/beachcam_003.csv?time,latitude,longitude,altitude,aboveGround,url,name,size"
        - "https://pae-paha.pacioos.hawaii.edu/erddap/tabledap/beachcam_004.csv?time,url,size&time>=2012-01-01&time<2012-01-20"
        - https://pae-paha.pacioos.hawaii.edu/erddap/info/beachcam_004/index.csv
        - https://thredds.cdip.ucsd.edu/thredds/dodsC/cdip/archive/106p1/106p1_historic.nc.das
      notes: >
        First historical benchmark: 17,854 Waimea images (beachcam_003: 8,935, 1.85 GB;
        beachcam_004: 8,919, 1.42 GB) concurrent with a directional Waverider 6 km offshore,
        two views of one site. Full indexes checked 2026-09-26: every file name is the UTC
        time minus 10 h (HST), no duplicate times. Per the metadata the photo may be taken
        anywhere within the named hour. 96.4% of image hours have a CDIP 106 sample starting
        within [t - 30 min, t + 1 h). Archive: wave-analysis pacioos beachcam. Camera-to-buoy
        wave transformation must be addressed (offshore buoy, surf-zone imagery).

