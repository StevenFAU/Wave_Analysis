    modalities: [bathymetry, multispectral]
    intended_roles: [context]
    access: {public: true, authentication_required: false, protocols: [HTTPS]}
    data_types: [topobathy_lidar, aerial_imagery, shoreline]
    documentation: [https://coast.noaa.gov/digitalcoast/]
    license: {status: public_domain_us_government}
    phase: v0.4.0
