  - dataset_id: yin2025_vwbt
    name: VWBT_9000 - Video dataset for nearshore wave-breaking type classification
    provider: Yin et al. (2025), Scientific Data 12:1722
    modalities: [rgb]
    intended_roles: [input]
    access: {public: true, authentication_required: false, protocols: [HTTPS]}
    data_types: [video_clips, breaking_type_labels]
    temporal: {notes: "Clips from ~10-min videos at 5-20 fps."}
    spatial: {platform_types: [shore_camera], coverage: "6 sites (USA: Currituck, Jennette's Pier, Oak Island NC; China)"}
    formats: [mp4, jpeg]
    documentation: [https://doi.org/10.1038/s41597-025-06005-5]
    citation: "Yin, H. et al. (2025). A video dataset for nearshore wave breaking type classification. Sci. Data 12, 1722. doi:10.1038/s41597-025-06005-5; data doi:10.6084/m9.figshare.28814993"
    license:
      status: CC-BY-NC-ND-4.0
      url: https://creativecommons.org/licenses/by-nc-nd/4.0/
      notes: "Non-commercial, no derivatives: derived datasets may not be redistributed."
    phase: v0.3.0
    doc: docs/literature/papers/kamagata2026.md
    verification:
      status: documented
      date: 2026-09-25
      evidence: [https://pmc.ncbi.nlm.nih.gov/articles/PMC12575733/]
      notes: >
        Labels are breaking TYPE (spilling/plunging/surging), not instrument wave parameters;
        site wave climatology in the paper is from ERA5 reanalysis. Used as the held-out test
        set by Kamagata et al. (2026).

