    citation: "PacIOOS Beach Camera 00N, <site>, Oahu, Hawaii. Pacific Islands Ocean Observing System. https://pae-paha.pacioos.hawaii.edu/erddap/ (accessed <date>)."
    license:
      status: free_reuse_with_acknowledgement
      notes: "ERDDAP 'license': may be used and redistributed for free, not for legal use; acknowledge PacIOOS."
