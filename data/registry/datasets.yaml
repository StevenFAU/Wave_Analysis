  - dataset_id: copernicus_marine_waves
    name: Copernicus Marine global/regional wave analysis and reanalysis
    provider: Copernicus Marine Service (Mercator Ocean International)
    modalities: [numerical_model]
    intended_roles: [context]
    access: {public: true, authentication_required: true, protocols: [API]}
