# Wave_Analysis dataset registry
# ------------------------------------------------------------------------------
# Verified catalogue of candidate public sources. Schema: src/wave_analysis/registry.py
# Validate with:  uv run wave-analysis registry validate
#
# verification.status:
#   verified    - accessed programmatically; formats confirmed on real files
#   documented  - confirmed from provider documentation only
#   candidate   - plausible and relevant, not yet checked (a research to-do)
#
# RULE: availability belongs to station + product + period, never to a provider
# as a whole. Per-station availability lives in the inventories (e.g.
# data/registry/ndbc_files.parquet), not here.
# ------------------------------------------------------------------------------
registry_version: "0.1.0"
datasets:

  - dataset_id: ndbc
    name: NOAA National Data Buoy Center
    provider: NOAA National Weather Service, National Data Buoy Center
    modalities: [in_situ_wave, meteorological, wind, acoustic, current, rgb]
    intended_roles: [reference, input, context]
    access:
      public: true
      authentication_required: false
      protocols: [HTTPS]
      endpoints:
        - https://www.ndbc.noaa.gov/data/realtime2/          # last 45 days
        - https://www.ndbc.noaa.gov/data/historical/         # annual gzipped files
        - https://www.ndbc.noaa.gov/activestations.xml
        - https://www.ndbc.noaa.gov/data/stations/station_table.txt
        - https://www.ndbc.noaa.gov/buoycams.php             # current camera snapshot (JSON)
      rate_limit_guidance: "NDBC asks users to limit retrievals to a minimal level; project default 1 request/s."
    data_types: [standard_meteorological, spectral_wave_summary, spectral_wave_density,
                 directional_spectrum_coefficients, adcp, oceanographic, continuous_winds,
                 water_level, solar_radiation, buoy_camera_snapshot]
    temporal:
      timezone: UTC
      coverage: "Varies by station; some records begin in the 1970s."
      wave_sampling: "20-min acquisition typical; timestamps rounded (see docs/datasets/ndbc.md)."
    spatial:
      platform_types: [moored_buoy, fixed_station, drifting_buoy]
      coverage: "U.S. coastal and offshore waters, Great Lakes, partner arrays worldwide."
    formats: [ascii, gzip, json, xml]
    documentation:
      - https://www.ndbc.noaa.gov/faq/rt_data_access.shtml
      - https://www.ndbc.noaa.gov/faq/measdes.shtml
      - https://www.ndbc.noaa.gov/faq/acq.shtml
      - https://www.ndbc.noaa.gov/historical_data.shtml
    citation: "National Data Buoy Center (NDBC), NOAA. Station <id> observations. https://www.ndbc.noaa.gov/ (accessed <date>)."
    license:
      status: public_domain_us_government
      url: https://www.weather.gov/disclaimer
    phase: v0.1.0
    adapter: wave_analysis.sources.ndbc.NDBCSource
    doc: docs/datasets/ndbc.md
    verification:
      status: verified
      date: 2026-09-25
      evidence:
        - https://www.ndbc.noaa.gov/data/historical/stdmet/41010h2023.txt.gz
        - https://www.ndbc.noaa.gov/data/realtime2/41010.data_spec
        - https://www.ndbc.noaa.gov/buoycams.php
      notes: >
        Parsers verified on 1995, 2003, 2006, 2023 and realtime formats. 4*sqrt(m0) of the
        published spectrum reproduces WVHT to rounding (station 41010, 2023, n = 4281).
        No public historical buoy-camera image archive was found; camera availability is
        a dated snapshot only.

  - dataset_id: cdip
    name: Coastal Data Information Program
    provider: Scripps Institution of Oceanography, UC San Diego (funded by USACE and California DPR)
    modalities: [in_situ_wave]
    intended_roles: [reference]
    access:
      public: true
      authentication_required: false
      protocols: [HTTPS, OPeNDAP, THREDDS]
      endpoints:
        - https://thredds.cdip.ucsd.edu/thredds/fileServer/cdip/archive/{stn}p1/{stn}p1_historic.nc
        - https://thredds.cdip.ucsd.edu/thredds/fileServer/cdip/archive/{stn}p1/{stn}p1_d{NN}.nc
        - https://thredds.cdip.ucsd.edu/thredds/fileServer/cdip/realtime/{stn}p1_rt.nc
        - https://thredds.cdip.ucsd.edu/thredds/dodsC/cdip/archive/{stn}p1/{stn}p1_historic.nc
        - https://thredds.cdip.ucsd.edu/thredds/catalog/cdip/archive/{stn}p1/catalog.xml
    data_types: [bulk_wave_parameters, spectral_wave_density, directional_fourier_coefficients,
                 surface_displacement_time_series, sea_surface_temperature]
    temporal:
      timezone: UTC
      acquisition_window: "explicit: waveTime = sample start, waveTimeBounds = 1600 s sample"
      interval: "30 min (time_coverage_resolution PT30M)"
    spatial: {platform_types: [moored_buoy], coverage: "U.S. coasts, Pacific islands; Datawell Waverider network"}
    formats: [netcdf]
    documentation:
      - https://cdip.ucsd.edu/
      - https://cdip.ucsd.edu/m/documents/
    citation: "Coastal Data Information Program (CDIP), Scripps Institution of Oceanography. Station <stn> data. https://cdip.ucsd.edu (accessed <date>)."
    license:
      status: unrestricted
      notes: >
        File 'license' attribute: "These data may be redistributed and used without restriction."
        'acknowledgment' attribute (106p1): "CDIP is primarily supported by the U.S. Army Corps
        of Engineers (USACE). Station partner: PACIOOS ; Field operator: PACIOOS/UH". Partners
        differ by station: copy the acknowledgment of each file used.
    phase: v0.2.0
    adapter: wave_analysis.sources.cdip.CDIPSource
    doc: docs/datasets/cdip.md
    verification:
      status: verified
      date: 2026-09-26
      evidence:
        - https://thredds.cdip.ucsd.edu/thredds/dodsC/cdip/realtime/134p1_rt.nc.dds
        - https://thredds.cdip.ucsd.edu/thredds/dodsC/cdip/archive/106p1/106p1_historic.nc.das
        - https://thredds.cdip.ucsd.edu/thredds/fileServer/cdip/archive/106p1/106p1_historic.nc
      notes: >
        106p1_historic.nc (1,048,703,572 bytes, sha256 778df335..., 388,533 records 2001-12-16
        to 2026-02-25) downloaded and standardized. On the 84,893 records of 2009-2013: waveHs
        equals 4*sqrt(sum(S*bandwidth)) (99th percentile difference 0.0075 m, max 0.046 m);
        atan2(b1, a1) reproduces waveMeanDirection exactly; every sample is 1600 s and starts
        at waveTime; all primary flags are 1 (historic files exclude records flagged bad);
        waveSourceIndex is 1-based (index 27 holds the 18,356 records of 106p1_d27.nc).

  - dataset_id: usgs_coastcam
    name: USGS CoastCams (14 sites in FL, PR, MA, CA, AK, Guam)
    provider: U.S. Geological Survey (St. Petersburg, Woods Hole and Pacific Coastal and Marine Science Centers)
    modalities: [rgb, in_situ_wave]
    intended_roles: [input, reference]
    access:
      public: true
      authentication_required: false
      protocols: [HTTPS, S3, API]
      endpoints:
        - https://cmgds.marine.usgs.gov/data/madeirabeach/
        - https://doi.org/10.5066/P9SGRTF1                                # Madeira Beach 2017-2022 release
        - https://api.waterdata.usgs.gov/nims/v0/cameras                  # NIMS camera list (public)
        - https://usgs-nims-images.s3.amazonaws.com/                      # public, listable image bucket
        - https://geoport.usgs.esipfed.org/erddap/tabledap/waves-Dorado.html  # Spotter at Dorado, PR
    data_types: [snapshot, timex, variance, bright, dark, runup_timestack,
                 intrinsic_calibration, extrinsic_calibration, hourly_snapshot_archive,
                 bulk_wave_parameters]
    temporal:
      timezone: UTC
      notes: >
        Data releases: Madeira Beach 2017-2022; Head of the Meadow (CACO-01) 2019-2025;
        Marconi (CACO-02) 2021, 2023, 2024. NIMS S3 hourly daylight snapshots since
        2023-04 (Sand Key 11,911; Madeira 15,875; Dorado C1 7,905 objects on 2026-09-26).
    spatial:
      platform_types: [shore_camera]
      coverage: >
        Sand Key, Madeira Beach, Tyndall AFB (FL); Dorado, Isla Verde (PR); Head of the
        Meadow, Marconi (MA); Santa Cruz, Sunset State Beach (CA); Unalakleet, Golovin,
        Teller, Shishmaref, Point Barrow (AK); Adelup Point (Guam).
      nearest_wave_reference: >
        CDIP 214/42098 (26-40 km, Tampa Bay sites); CDIP 156/46236 (18-24 km, Monterey Bay);
        CDIP 221/44090 (31 km, Cape Cod); CDIP 121/52200 (15 km, Guam); Dorado: USGS
        Spotter ~2 km offshore (2022-10 to 2024-12) and CDIP 249/41121 (44 km).
    formats: [jpeg, png, mat, txt, csv]
    documentation:
      - https://www.usgs.gov/programs/cmhrp/science/usgs-coastcams
      - https://cmgds.marine.usgs.gov/catalog/spcmsc/MadeiraBeachFL_CoastCam_imagery_metadata.html
      - https://api.waterdata.usgs.gov/docs/nims
    citation: "USGS CoastCam data releases, e.g. Madeira Beach, Florida CoastCam imagery and calibration data, doi:10.5066/P9SGRTF1."
    license:
      status: public_domain_us_government
      notes: "NIMS 'overlay' images carry burned-in text: mask before training."
    phase: v0.2.0
    adapter: wave_analysis.sources.coastcam.CoastCamSource
    doc: docs/datasets/coastcam.md
    verification:
      status: verified
      date: 2026-09-26
      evidence:
        - https://api.waterdata.usgs.gov/nims/v0/cameras
        - https://usgs-nims-images.s3.amazonaws.com/?list-type=2&prefix=overlay/FL_Sand_Key/
        - https://geoport.usgs.esipfed.org/erddap/tabledap/waves-Dorado.csv
      notes: >
        Queried programmatically: NIMS lists 29 coastal cameras; the S3 bucket is publicly
        listable; the Dorado Spotter is on the USGS geoport ERDDAP (provisional data).
        Calibrated IO/EO parameters come with the data releases. Pairing distances computed
        from CDIP latest_3day.nc metadata (docs/literature/landscape_review.md section 5.3).

  - dataset_id: webcoos
    name: WebCOOS - Webcam Coastal Observation System
    provider: SECOORA / NOAA IOOS partners
    modalities: [rgb]
    intended_roles: [input]
    access:
      public: true
      authentication_required: true
      protocols: [HTTPS, API, S3]
      endpoints:
        - https://app.webcoos.org/webcoos/api/v1/assets/
        - https://app.webcoos.org/webcoos/api/v1/services/{service}/inventory/
        - https://app.webcoos.org/webcoos/api/v1/elements/?service={service}&starting_after={t}&starting_before={t}&page_size=1000
        - https://s3.us-west-2.amazonaws.com/webcoos/media/   # image files (public; no token)
      rate_limit_guidance: >
        Usage guidelines: "Download only a reasonable amount of data"; contact
        webcoos@secoora.org before downloading "a large amount of data that is greater than
        90 days old". Project default 1 request/s, stills thinned to a 30-min grid.
    data_types: [one_minute_stills, video_archive, annotated_image, object_detection_results,
                 rip_detection_results, video_streams]
    temporal:
      timezone: UTC
      notes: >
        One-minute stills in daylight, with the capture time to the second
        (extents.temporal.min). Yin et al. (2025) cameras, inventories of 2026-09-26:
        currituck_hampton_inn 2022-01-04 to present (1.11 M stills, 692 GB);
        jennette_south 2022-10-03 to 2026-09-16 (1.01 M, 634 GB); oakisland_east 2022-01-01
        to present (977 k, 295 GB); oakisland_west 2021-12-03 to present (921 k, 289 GB);
        jennette_north: inventory request timed out (HTTP 504), no stills in the last day.
    spatial:
      platform_types: [shore_camera]
      coverage: "86 cameras (2026-09-26), U.S. coasts and Great Lakes; 7 in North Carolina"
    formats: [jpeg, mp4, json]
    documentation:
      - https://webcoos.org/usage-guidelines
      - https://github.com/WebCOOS/py-webcoos-client
      - https://ioos.noaa.gov/project/ott-webcoos/
    citation: >
      "SECOORA is acknowledged for leading the WebCOOS program, which collected [images of
      interest] in the WebCOOS dataset in this study," citing WebCOOS as "WebCOOS
      [year(s) of imagery]" (usage guidelines).
    license:
      status: usage_guidelines
      url: https://webcoos.org/usage-guidelines
      notes: >
        No licence field in the API metadata. The usage guidelines permit lawful, ethical use,
        reserve the right to request removal or restrict use, ask for "a reasonable amount of
        data", require contacting webcoos@secoora.org before large downloads of data older than
        90 days, and give the acknowledgement above. Redistribution is not addressed: ask
        before publishing images.
    phase: v0.2.0
    adapter: wave_analysis.sources.webcoos
    doc: docs/datasets/webcoos.md
    verification:
      status: verified
      date: 2026-09-26
      evidence:
        - https://app.webcoos.org/webcoos/api/v1/assets/
        - https://app.webcoos.org/webcoos/api/v1/services/oakisland_west-one-minute-stills-s3/inventory/
        - https://webcoos.org/usage-guidelines
      notes: >
        Accessed with a project token: HTTP 403 without it, 200 with "Authorization: Token
        <key>". 86 camera assets; all five Yin et al. (2025) cameras are public and listed.
        Elements carry the capture time and file size; image files are on a public S3 bucket.
        Stills downloaded and checked (2560 x 1440 JPEG with EXIF). page_size=1000 is honoured
        (default 100). Nearest wave buoys (km from the API positions): Currituck -> CDIP
        433/44056 (22.2); Jennette's Pier -> CDIP 243/44086 (18.6); Oak Island -> CDIP
        200/41108 (28.9, historic record ends 2026-07-20, no realtime file on 2026-09-26).

