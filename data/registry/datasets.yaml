  - dataset_id: wass_stereo
    name: WASS stereo wave-video datasets
    provider: Bergamasco, Benetazzo et al. (Ca' Foscari University of Venice / CNR-ISMAR)
    modalities: [stereo, rgb]
    intended_roles: [reference, input]
    access: {public: true, authentication_required: false, protocols: [HTTPS]}
    data_types: [stereo_video, reconstructed_surface_elevation]
    documentation: [https://sites.google.com/unive.it/wass]
    license: {status: to_be_confirmed}
    phase: v0.4.0
    doc: docs/datasets/README.md
    verification:
      status: candidate
      notes: >
        Stereo reconstruction gives space-time surface elevation - a geometric ground truth for
        video that no point sensor can provide. High priority for spatial (Level 7) tasks.
