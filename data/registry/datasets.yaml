    documentation: [https://sentinels.copernicus.eu/]
    license: {status: copernicus_open_access}
    phase: v0.4.0
    adapter: wave_analysis.sources.satellite.SentinelSource
    doc: docs/datasets/satellite_sar.md
    verification: {status: candidate}

