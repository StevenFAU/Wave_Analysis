site_name: Wave_Analysis
site_description: Reproducible multimodal ocean-wave data and vision-based wave-state estimation
site_url: https://stevenfau.github.io/Wave_Analysis/docs/
repo_url: https://github.com/StevenFAU/Wave_Analysis
edit_uri: edit/main/docs/
theme:
  name: material
  features: [navigation.sections, navigation.top, search.highlight, content.code.copy]
markdown_extensions:
  - admonition
  - tables
  - toc: {permalink: true}
  - pymdownx.arithmatex: {generic: true}
  - pymdownx.superfences
  - pymdownx.highlight
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
not_in_nav: |
  literature/bibliography.bib
nav:
  - Home: index.md
  - Dashboard ↗: https://stevenfau.github.io/Wave_Analysis/
  - Project:
      - Standards: STANDARDS.md
      - Architecture: ARCHITECTURE.md
      - Data model: DATA_MODEL.md
      - Quality control: QUALITY_CONTROL.md
      - Provenance: PROVENANCE.md
      - Reproducibility: REPRODUCIBILITY.md
      - Citation policy: CITATION_POLICY.md
      - Roadmap: ROADMAP.md
  - Methodology:
      - Acquisition: methodology/acquisition.md
      - Preprocessing: methodology/preprocessing.md
      - Wave parameters: methodology/wave_parameters.md
      - Spectral analysis: methodology/spectral_analysis.md
      - Synchronisation: methodology/synchronization.md
      - Imagery: methodology/imagery_processing.md
      - Dataset splitting: methodology/dataset_splitting.md
      - Evaluation: methodology/evaluation.md
      - Models: methodology/models.md
  - Datasets:
      - Overview & template: datasets/README.md
      - NDBC: datasets/ndbc.md
      - NDBC ADCP: datasets/ndbc_adcp.md
      - CDIP: datasets/cdip.md
      - PacIOOS beach cameras: datasets/pacioos_beachcam.md
      - IOOS / ERDDAP: datasets/ioos.md
      - WebCOOS: datasets/webcoos.md
      - ERA5 waves: datasets/era5.md
      - USGS CoastCam: datasets/coastcam.md
      - Satellite SAR: datasets/satellite_sar.md
      - Multispectral: datasets/multispectral.md
      - Thermal IR: datasets/thermal_ir.md
      - Research datasets (stereo, IR): datasets/external_research_datasets.md
  - Operations:
      - Continuous data collection: operations/data_collection.md
      - Collection plan: operations/collection_plan.md
      - Public dashboard: operations/dashboard.md
  - Literature:
      - Landscape review: literature/landscape_review.md
      - Data source scan (2026-10): literature/data_source_scan_2026-10.md
      - Matrix: literature/literature_matrix.md
      - Research gaps: literature/research_gaps.md
      - Source verification: literature/source_verification.md
      - Paper notes:
          - Overview: literature/papers/README.md
          - Choi 2020: literature/papers/choi2020.md
          - Kim 2023: literature/papers/kim2023.md
          - Kamagata 2026: literature/papers/kamagata2026.md
          - Yang 2026: literature/papers/yang2026.md
