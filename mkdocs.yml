      - Index: decisions/README.md
      - 0001 Preserve & annotate: decisions/0001-preserve-raw-annotate-dont-delete.md
      - 0002 Long-format observations: decisions/0002-long-format-observations.md
      - 0003 Preserve spectra: decisions/0003-preserve-spectra.md
      - 0004 QC flag vocabulary: decisions/0004-single-qc-flag-vocabulary.md
      - 0005 Group-based splits: decisions/0005-group-based-splits.md
      - 0006 Manifests not data: decisions/0006-manifests-not-data-in-git.md
      - 0007 Optional deep learning: decisions/0007-optional-deep-learning.md
